<html lang="en">

<style>

</head>

<body>

<div class="app">

    <h1>🔐 PASSWORD GENERATOR</h1>

    <div class="subtitle">
        Create a strong random password
    </div>

    <input
        id="password"
        class="password"
        type="text"
        readonly
    >

    <div id="strength" class="strength">
        Strength: ---
    </div>

    <div class="length">
        Password Length:
        <input
            id="length"
            type="number"
            value="16"
            min="4"
            max="32"
        >
    </div>

    <div class="options">

        <label>
            <input id="uppercase" type="checkbox" checked>
            ABC&nbsp; Uppercase
        </label>

        <label>
            <input id="numbers" type="checkbox" checked>
            123&nbsp; Numbers
        </label>

        <label>
            <input id="lowercase" type="checkbox" checked>
            abc&nbsp; Lowercase
        </label>

        <label>
            <input id="symbols" type="checkbox" checked>
            !@#&nbsp; Symbols
        </label>

    </div>

    <button class="generate" onclick="generatePassword()">
        ⚡ GENERATE PASSWORD
    </button>

    <button class="copy" onclick="copyPassword()">
        📋 COPY PASSWORD
    </button>

    <div id="status" class="status">
        Ready
    </div>

    <div class="footer">
        Passwords are generated locally on your device.
    </div>

</div>


<script>

function generatePassword() {

    const length = Number(
        document.getElementById("length").value
    );

    if (length < 4 || length > 32) {
        alert("Password length must be between 4 and 32.");
        return;
    }

    let characters = "";

    if (document.getElementById("uppercase").checked) {
        characters += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
    }

    if (document.getElementById("lowercase").checked) {
        characters += "abcdefghijklmnopqrstuvwxyz";
    }

    if (document.getElementById("numbers").checked) {
        characters += "0123456789";
    }

    if (document.getElementById("symbols").checked) {
        characters += "!@#$%^&*()-_=+[]{};:,.?/";
    }

    if (characters.length === 0) {
        alert("Select at least one character type.");
        return;
    }

    let password = "";

    const randomArray = new Uint32Array(length);
    crypto.getRandomValues(randomArray);

    for (let i = 0; i < length; i++) {
        password += characters[
            randomArray[i] % characters.length
        ];
    }

    document.getElementById("password").value = password;

    checkStrength(password);

    document.getElementById("status").textContent = "Ready";
}


function checkStrength(password) {

    let score = 0;

    if (password.length >= 8) score++;
    if (password.length >= 12) score++;

    if (/[A-Z]/.test(password)) score++;
    if (/[a-z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    const strength =
        document.getElementById("strength");

    if (score <= 2) {
        strength.textContent = "Strength: Weak";
    }
    else if (score <= 4) {
        strength.textContent = "Strength: Medium";
    }
    else {
        strength.textContent = "Strength: Strong";
    }
}


async function copyPassword() {

    const password =
        document.getElementById("password").value;

    if (!password) {
        alert("Generate a password first.");
        return;
    }

    try {
        await navigator.clipboard.writeText(password);

        document.getElementById("status").textContent =
            "✓ Password copied!";
    }
    catch {
        alert("Copy failed. Please copy the password manually.");
    }
}


generatePassword();

</script>

</body>
